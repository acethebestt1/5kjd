<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syndex Systems</title>
<link rel="icon" type="image/png" href="/images/logotwo.png">
<style>
:root { --cream: #d2c9bb; --muted: #a89f8d; --faint: #6f6a5e; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #f2ede1;
  background: #000;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  background-image: radial-gradient(700px 380px at 50% 30%, rgba(210, 201, 187, .08), transparent 60%),
    radial-gradient(600px 500px at 12% 85%, rgba(88, 101, 242, .12), transparent 60%),
    radial-gradient(500px 400px at 88% 78%, rgba(60, 170, 200, .07), transparent 60%);
  overflow: hidden;
}
.sky { position: fixed; inset: 0; overflow: hidden; }
.star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 3s infinite ease-in-out; }
@keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
.nebula { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; }
.nebula.one { width: 480px; height: 480px; left: -140px; bottom: -160px; background: rgba(88, 101, 242, .16); }
.nebula.two { width: 380px; height: 380px; right: -120px; top: -100px; background: rgba(210, 201, 187, .07); }
.shoot {
  position: fixed; top: 12%; right: 8%;
  width: 130px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, #fff, transparent);
  opacity: 0; animation: shoot 8s infinite ease-out;
}
@keyframes shoot {
  0%, 88% { transform: translateX(0) rotate(-28deg); opacity: 0; }
  90% { opacity: 1; }
  96%, 100% { transform: translateX(-42vw) rotate(-28deg); opacity: 0; }
}
.wrap { max-width: 520px; padding: 40px 24px; position: relative; z-index: 2; }
.wrap { max-width: 520px; padding: 40px 24px; position: relative; z-index: 2; }
.dot {
  width: 12px; height: 12px; margin: 0 auto 22px; border-radius: 50%;
  background: #e0a44a; box-shadow: 0 0 18px #e0a44a;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 42px); letter-spacing: -1px; font-weight: 800; }
h1 span {
  background: linear-gradient(120deg, #e9e0cf, #d2c9bb 60%, #b3a78f);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
p { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: var(--muted); }
.btns { margin-top: 22px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
a.btn {
  display: inline-block;
  border-radius: 12px;
  padding: 12px 24px;
  font-weight: 800;
  font-size: 14px;
  text-decoration: none;
  transition: transform .12s ease, filter .12s ease;
}
a.btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
a.discord-btn { color: #fff; background: #5865F2; }
footer { margin-top: 34px; font-size: 12px; color: var(--faint); }
footer b { color: var(--muted); }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="nebula one"></div>
<div class="nebula two"></div>
<div class="shoot"></div>
<div class="wrap">
  <div class="dot"></div>
  <h1>Give us a minute.</h1>
  <p>Syndex is down for a moment, usually just a quick restart. Nothing of yours is going anywhere. Dashboards and bots pick up right where they left off.</p>

  <div class="btns">
    <a class="btn discord-btn" href="https://discord.gg/syndex" target="_blank" rel="noopener">Join our Discord</a>
  </div> 
  <footer>Made by <a href="https://discord.gg/syndex" target="_blank" rel="noopener" style="color: #b3a78f;">Syndex Systems</a> — Roleplay bots you can trust. - This site is being hosted by <a href="https://discord.com/users/987028446137962496" target="_blank" rel="noopener" style="color: #b3a78f;">5kjd </a></footer>
</footer>
</div>
<script>
(function(){
  var sky = document.getElementById('sky');
  for(var i = 0; i < 130; i++){
    var s = document.createElement('span');
    s.className = 'star';
    var big = Math.random() < 0.12;
    var size = big ? 3 : (Math.random() < 0.5 ? 1 : 2);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top = (Math.random() * 100) + 'vh';
    if(Math.random() < 0.2) s.style.background = '#d2c9bb';
    s.style.animationDuration = (2 + Math.random() * 4) + 's';
    s.style.animationDelay = (Math.random() * 5) + 's';
    sky.appendChild(s);
  }
})();
</script>
</body>
</html>
